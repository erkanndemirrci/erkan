<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title id="pageTitle">Blog Yazısı | Erkan Demirci</title>
<meta name="description" id="pageDesc" content="" />
<link rel="canonical" id="pageCanonical" href="blog-yazisi.html" />
<meta property="og:title" id="ogTitle" content="" />
<meta property="og:image" id="ogImage" content="assets/images/erkan-og.jpg" />
<link rel="icon" type="image/jpeg" href="assets/images/erkan-avatar.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<a href="#main" class="skip-link">İçeriğe geç</a>
<div id="site-header"></div>

<main id="main">
  <div id="postContent"></div>
  <div id="notFound" style="display:none;">
    <section class="page-header text-center">
      <div class="container">
        <h1>Yazı Bulunamadı</h1>
        <p class="lede mt-16" style="margin:0 auto;">Aradığın blog yazısı kaldırılmış veya taşınmış olabilir.</p>
        <a href="blog.html" class="btn btn-primary mt-24">Bloga Dön</a>
      </div>
    </section>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/data/site-config.js"></script>
<script src="assets/data/projects.js"></script>
<script src="assets/data/posts.js"></script>
<script src="assets/data/prompts.js"></script>
<script src="assets/data/documents.js"></script>
<script src="assets/js/content.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/search.js"></script>
<script src="assets/js/partials.js"></script>
<script>
  const slug = Content.getQueryParam("slug");
  const post = POSTS.find(p => p.slug === slug);

  if (!post) {
    document.getElementById("notFound").style.display = "block";
  } else {
    document.getElementById("pageTitle").textContent = (post.seo && post.seo.title) || (post.title + " | Erkan Demirci");
    document.getElementById("pageDesc").setAttribute("content", (post.seo && post.seo.description) || post.excerpt);
    document.getElementById("ogTitle").setAttribute("content", post.title);
    if (post.seo && post.seo.ogImage) document.getElementById("ogImage").setAttribute("content", post.seo.ogImage);
    document.getElementById("pageCanonical").setAttribute("href", "blog-yazisi.html?slug=" + encodeURIComponent(post.slug));

    const related = POSTS.filter(p => p.slug !== post.slug && p.category === post.category).slice(0, 3);
    const relatedFallback = related.length ? related : POSTS.filter(p => p.slug !== post.slug).slice(0, 3);

    document.getElementById("postContent").innerHTML = `
      <section class="page-header">
        <div class="container">
          <div class="breadcrumb reveal in"><a href="index.html">Ana Sayfa</a> / <a href="blog.html">Blog</a> / ${Content.escapeHtml(post.category)}</div>
          <div class="eyebrow reveal in">${Content.escapeHtml(post.category)}</div>
          <h1 class="reveal in" style="max-width:820px;">${Content.escapeHtml(post.title)}</h1>
          <div class="flex gap-16 items-center mt-24 reveal in" style="color:var(--c-text-faint); font-family:var(--font-mono); font-size:0.85rem; flex-wrap:wrap;">
            <span>${Content.formatDate(post.date)}</span><span>·</span><span>${Content.escapeHtml(post.readTime||"")} okuma</span>
          </div>
        </div>
      </section>

      <section class="section-tight">
        <div class="container">
          <div class="grid" style="grid-template-columns: 2.2fr 1fr; gap:56px; align-items:flex-start;">
            <div class="reveal in">
              ${post.cover ? `<img src="${post.cover}" alt="${Content.escapeHtml(post.title)}" style="width:100%; border-radius:var(--radius-lg); border:1px solid var(--c-border); margin-bottom:36px;" />` : `<div class="ph-cover" style="aspect-ratio:16/9; border-radius:var(--radius-lg); margin-bottom:36px;"><span>${Content.escapeHtml(post.title)}</span></div>`}
              <article class="prose">${post.content}</article>
              <div class="divider"></div>
              <div class="tag-cloud">
                ${(post.tags||[]).map(t => `<a class="tag-pill" href="blog.html?tag=${encodeURIComponent(t)}">#${Content.escapeHtml(t)}</a>`).join("")}
              </div>
            </div>
            <aside class="reveal in">
              <div class="card" style="position:sticky; top:100px;">
                <h3 style="font-size:1rem; margin-bottom:16px;">İlgili Yazılar</h3>
                <div style="display:flex; flex-direction:column; gap:14px;">
                  ${relatedFallback.map(p => `
                    <a href="blog-yazisi.html?slug=${encodeURIComponent(p.slug)}" style="display:block; padding:12px; border-radius:12px; border:1px solid var(--c-border); transition:border-color .2s;">
                      <div class="post-meta" style="margin-bottom:4px;"><span class="cat">${Content.escapeHtml(p.category)}</span></div>
                      <div style="font-size:0.9rem; font-weight:600;">${Content.escapeHtml(p.title)}</div>
                    </a>
                  `).join("")}
                </div>
                <a href="blog.html" class="btn btn-secondary btn-block mt-24">Tüm Yazılar</a>
              </div>
            </aside>
          </div>
        </div>
      </section>
    `;
  }
</script>
</body>
</html>
