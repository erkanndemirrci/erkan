<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prompt Kütüphanesi | Erkan Demirci</title>
<meta name="description" content="Görsel üretim, video, Gemini, Claude, ChatGPT, Kling ve daha fazlası için hazır AI promptları." />
<link rel="canonical" href="prompt-kutuphanesi.html" />
<meta property="og:title" content="Prompt Kütüphanesi | Erkan Demirci" />
<meta property="og:image" content="assets/images/erkan-og.jpg" />
<link rel="icon" type="image/jpeg" href="assets/images/erkan-avatar.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<a href="#main" class="skip-link">İçeriğe geç</a>
<div id="site-header"></div>

<main id="main">
  <section class="page-header">
    <div class="container">
      <div class="breadcrumb reveal in"><a href="index.html">Ana Sayfa</a> / Prompt Kütüphanesi</div>
      <div class="eyebrow reveal in">Prompt Kütüphanesi</div>
      <h1 class="reveal in">Hazır AI Promptları</h1>
      <p class="lede reveal in mt-16">Görsel üretim, video, reklam ve otomasyon için test edilmiş promptları keşfet, tek tıkla kopyala.</p>
    </div>
  </section>

  <section class="section-tight">
    <div class="container">
      <div class="search-box reveal in">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="promptSearch" placeholder="Prompt ara... (örn. video, portre, Gemini)" />
      </div>
      <div class="filter-bar reveal in" id="filterBar"></div>
      <div class="grid grid-3" id="promptsGrid"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/data/site-config.js"></script>
<script src="assets/data/projects.js"></script>
<script src="assets/data/posts.js"></script>
<script src="assets/data/prompts.js"></script>
<script src="assets/data/documents.js"></script>
<script src="assets/js/content.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/search.js"></script>
<script src="assets/js/partials.js"></script>
<script>
  const CATS = ["Tümü", "Görsel Üretim", "Video", "Gemini", "Claude", "ChatGPT", "Kling", "AI Reklam", "Instagram", "Fotoğraf", "Eğitim", "Otomasyon", "Diğer"];
  let activeCat = "Tümü";
  let query = "";

  function renderFilters() {
    document.getElementById("filterBar").innerHTML = CATS.map(c => `
      <button class="filter-btn ${c === activeCat ? 'active' : ''}" data-cat="${c}">${c}</button>
    `).join("");
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => { activeCat = btn.getAttribute("data-cat"); renderFilters(); renderGrid(); });
    });
  }

  function renderGrid() {
    let list = activeCat === "Tümü" ? PROMPTS : PROMPTS.filter(p => p.category === activeCat || p.ai === activeCat);
    if (query) {
      const q = query.toLowerCase();
      list = list.filter(p => (p.title + p.excerpt + p.category + p.ai + (p.tags||[]).join(" ")).toLowerCase().includes(q));
    }
    const grid = document.getElementById("promptsGrid");
    grid.innerHTML = list.length ? list.map(Content.promptCardHtml).join("") : Content.emptyStateHtml("Aramanızla eşleşen bir prompt bulunamadı.");
  }

  document.getElementById("promptSearch").addEventListener("input", (e) => { query = e.target.value; renderGrid(); });

  renderFilters();
  renderGrid();
</script>
</body>
</html>
